plugins {
    id 'java'
    id 'xh.xianhhh.jar2dll' version '1.0.0'
}

group = 'xh.xianhhh.test'
version = '1.0.0'

dependencies {
    implementation 'xh.xianhhh:jar2dll:1.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'xh.xianhhh.test.J2dTestMain'
    }
}

jar2dll {
    outputName = 'j2d-test.dll'
    canDump = true
}

plugins {
    id 'java'
    id 'application'
}

group = 'xh.xianhhh'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.ow2.asm:asm:9.8'
    implementation 'org.ow2.asm:asm-tree:9.8'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'xh.xianhhh.MemoryLoadRewriter'
}

tasks.register('memoryRewriterJar', Jar) {
    archiveFileName = 'memory-rewriter.jar'
    manifest { attributes 'Main-Class': 'xh.xianhhh.MemoryLoadRewriter' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}

jar{
    manifest{
        attributes 'Main-Class': 'xh.xianhhh.Main'
    }
}

test {
    useJUnitPlatform()
}
